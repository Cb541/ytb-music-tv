name: Custom Apple TV Music Player

on:
  workflow_dispatch:
  push:
    branches: [custom-music-player, "custom-music-player-*"]
    paths:
      - 'client-tvos/**'
      - 'server/src/features/spatial-stream.js'
      - 'server/src/features/auto-eq.js'
      - 'server/src/lib/router.js'
      - 'server/test/spatial-stream.test.js'
      - 'server/Dockerfile'
      - '.github/workflows/custom-music-player.yml'

permissions:
  contents: read

concurrency:
  group: custom-music-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verify all three profile-specific HLS streams before packaging the client.
  spatial-stream-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg if needed
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Test AAC HLS spatial output
        run: node --test server/test/spatial-stream.test.js

  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
      - name: Test playback decoding and lyric timing
        run: bash client-tvos/test-models.sh
      - name: Verify known Apple Music motion MP4 response
        shell: bash
        run: |
          curl --head --location --silent --show-error --max-time 20 \
            --write-out 'Apple artwork status: %{http_code} content-type: %{content_type} bytes: %{size_download}\\n' \
            --url 'https://mvod.itunes.apple.com/itunes-assets/HLSVideo211/v4/97/27/b8/9727b8cd-0941-b676-f0dd-892e8b90bf08/P1498503123_Anull_video_gr240_sdr_768x768-.mp4' | tail -n 15
      - name: Build unsigned Apple TV IPA
        working-directory: client-tvos
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: '0.1.0'
          OUTPUT_IPA: ${{ github.workspace }}/YTBMusicTV-custom-music-player-unsigned.ipa
        run: bash build-ipa.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: YTBMusicTV-custom-music-player-unsigned
          path: YTBMusicTV-custom-music-player-unsigned.ipa
          if-no-files-found: error
